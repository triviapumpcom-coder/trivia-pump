<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpFun LiveChat</title>
</head>
<body>
    <h1>PumpFun LiveChat</h1>
    <div id="status">Connecting...</div>
    <hr>
    <div id="messages"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const socket = io();
            const messagesContainer = document.getElementById('messages');
            const statusContainer = document.getElementById('status');

            const MAX_MESSAGES = 100;

            function shortenUsername(username) {
                if (!username) return 'Anonymous';
                if (username.length > 20 && /^[A-Za-z0-9]+$/.test(username)) {
                    return `${username.substring(0, 4)}...${username.substring(username.length - 4)}`;
                }
                if (username.length > 15) {
                    return `${username.substring(0, 12)}...`;
                }
                return username;
            }

            function addMessage(data) {
                if (!data || !data.message) return;

                const messageElement = document.createElement('p');
                
                const usernameSpan = document.createElement('b');
                usernameSpan.textContent = `${shortenUsername(data.username)}: `;
                
                const textSpan = document.createElement('span');
                textSpan.textContent = data.message;

                messageElement.appendChild(usernameSpan);
                messageElement.appendChild(textSpan);
                
                messagesContainer.appendChild(messageElement);

                if (messagesContainer.children.length > MAX_MESSAGES) {
                    messagesContainer.removeChild(messagesContainer.firstChild);
                }
                
                window.scrollTo(0, document.body.scrollHeight);
            }

            socket.on('status', (data) => {
                statusContainer.textContent = `Status: ${data.message}`;
            });

            socket.on('chat-event', (data) => {
                addMessage(data);
            });
            
            socket.on('connect', () => {
                console.log('Connected to server.');
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server.');
                statusContainer.textContent = 'Status: Disconnected';
            });
        });
    </script>
</body>
</html>
