[build]
  publish = "apps/web/dist"
  command = "cd apps/web && npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"
  NODE_ENV = "production"

# Functions disabled - using external API server

# API redirects disabled - using external API server

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm dev"
  port = 5176
  targetPort = 5001
