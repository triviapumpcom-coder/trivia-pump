<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Pump Stream</title>
    <link rel="icon" type="image/png" href="/logo-quiz.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress MetaMask connection errors
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && 
            (event.reason.message.includes('MetaMask') || 
             event.reason.message.includes('Failed to connect') ||
             event.reason.message.includes('extension not found'))) {
          event.preventDefault();
          console.warn('MetaMask connection suppressed:', event.reason.message);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
